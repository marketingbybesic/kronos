name: Kronos
options:
  bundleIdPrefix: com.besic
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Alpha: debug
  Release: release
  AppStore: release

packages:
  KronosCore:
    path: Packages/KronosCore
  KronosSnapshot:
    path: Packages/KronosSnapshot
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 2.2.1
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1

settings:
  base:
    OTHER_SWIFT_FLAGS: "$(inherited) -DKRONOS_PUBLIC"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_LANGUAGE: en
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULE_DEBUGGING: NO

targets:
  Kronos:
    type: application
    platform: macOS
    configFiles:
      Release: Release.xcconfig
    sources:
      - path: Kronos
        excludes: ["**/.DS_Store"]
      # Used by Settings > MCP "Connect all local AI tools". optional: the public export drops
      # scripts/private, and the button then says node/script are unavailable instead of failing.
      - path: scripts/public/connect-harnesses.mjs
        optional: true
        buildPhase: resources
    dependencies:
      - package: KronosCore
        product: KronosCore
      - package: KronosSnapshot
        product: KronosSnapshot
      - package: KeyboardShortcuts
      - package: MarkdownUI
      - sdk: EventKit.framework
      - sdk: Network.framework
      - sdk: ServiceManagement.framework
      # MCP bridge, embedded at Kronos.app/Contents/MacOS/kronos-mcp and signed on copy.
      - target: kronos-mcp
        embed: true
        codeSign: true
        copy:
          destination: executables
    info:
      path: Kronos/Info.plist
      properties:
        CFBundleName: Kronos
        CFBundleDisplayName: Kronos
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # The development language is English; bundled languages are
        # en + hr, declared here so macOS itself offers both under System Settings > General >
        # Language & Region > Applications (per-app language), independent of Settings' own
        # AppleLanguages override.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, hr]
        LSMinimumSystemVersion: "14.0"
        LSUIElement: false
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Marketing by Bešić"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCalendarsFullAccessUsageDescription: "Kronos reads your calendar to show how much free time today has. Nothing leaves this Mac."
        NSRemindersFullAccessUsageDescription: "Kronos reads your open reminders so you can turn them into tasks. Nothing is changed in Reminders and nothing leaves this Mac."
        NSAppleEventsUsageDescription: "Kronos reads the Apple Notes you choose, and the page, message or file you are looking at in your browser, Mail or Finder when you capture it, so it can turn them into tasks and give a task its context. Nothing is changed in those apps and nothing leaves this Mac unless you use an online AI model."
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        # macOS integration without a developer program (Kronos/App/URLScheme.swift, ServicesProvider.swift,
        # DockMenu.swift, BackupOpen.swift).
        CFBundleURLTypes:
          - CFBundleURLName: com.besic.kronos.url
            CFBundleURLSchemes: [kronos]
            CFBundleTypeRole: Editor
        NSServices:
          - NSMenuItem:
              default: Add to Kronos
            NSMessage: addToKronos
            NSPortName: Kronos
            NSSendTypes: [NSStringPboardType, public.utf8-plain-text]
          - NSMenuItem:
              default: Capture in Kronos
            NSMessage: captureInKronos
            NSPortName: Kronos
            NSSendTypes: [NSStringPboardType, public.utf8-plain-text]
          - NSMenuItem:
              default: Add link to Kronos
            NSMessage: addLinkToKronos
            NSPortName: Kronos
            NSSendTypes: [public.file-url, public.url, NSURLPboardType, NSFilenamesPboardType]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Kronos backup
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.besic.kronos.backup]
        # The private type a task row's drag carries its own marker under (Kronos/List/DropZonePayload.swift).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.kronos.drag-item
            UTTypeDescription: Kronos drag item
            UTTypeConformsTo: [public.data]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.besic.kronos.backup
            UTTypeDescription: Kronos backup
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [kronos.json]
        # Filled by the "Stamp build id" post-compile script with the git short hash (falls
        # back to "dev" outside a git checkout) — Settings > General shows it after the version
        # so a stale build is obvious at a glance (owner tested a stale build once).
        KronosBuildID: dev
    postBuildScripts:
      - name: "Stamp build id"
        script: |
          "$SRCROOT/scripts/write-build-id.sh"
        basedOnDependencyAnalysis: false
        # Orders the stamp AFTER ProcessInfoPlistFile; without it Xcode runs the script first
        # and the processed plist overwrites the id with "dev".
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.besic.kronos
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
      configs:
        Alpha:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Kronos Dev"
          ENABLE_HARDENED_RUNTIME: NO
          ENABLE_APP_SANDBOX: NO
          DEVELOPMENT_TEAM: ""
        # Every build up to this release used Alpha (a debug config): unoptimised, and slower to
        # launch than what the app will actually ship. Release adds full optimisation and
        # strips the in-app test harnesses (LiveUITest*, LiveSelfTest, SnapshotHarness, every
        # *Snapshots.swift registry — 2,725 lines that exist to drive hand-testing, never to
        # ship) so neither their code nor their strings end up in the binary a stranger builds.
        #
        # Signing defaults to ad hoc ("-": no certificate, no team) so anyone can build and run
        # this without an Apple Developer account, matching Alpha's own unsigned posture. An
        # untracked Local.xcconfig (see Local.xcconfig.example) lets a signed build override
        # CODE_SIGN_IDENTITY/DEVELOPMENT_TEAM without editing this file or committing a
        # personal identity.
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: RELEASE
          CODE_SIGN_STYLE: Manual
          # CODE_SIGN_IDENTITY and DEVELOPMENT_TEAM are NOT set here: a target-level setting beats
          # an xcconfig, which silently turned Local.xcconfig into a no-op. Their ad hoc defaults
          # live in Release.xcconfig, ahead of the optional include that may override them.
          ENABLE_HARDENED_RUNTIME: NO
          ENABLE_APP_SANDBOX: NO
          # Alpha's debug dylib carries the absolute build path (DWARF debug info) inside the
          # binary itself (`strings` on Kronos.debug.dylib shows the
          # build directory). None of that belongs in a build that ships: debug info moves to a
          # sidecar dSYM, the product is stripped, and Release links the normal way (a debug
          # dylib exists so Xcode can hot-swap code during development — Release never needs it).
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          ENABLE_DEBUG_DYLIB: NO
          STRIP_INSTALLED_PRODUCT: YES
          COPY_PHASE_STRIP: YES
          DEPLOYMENT_POSTPROCESSING: YES
          # No EXCLUDED_SOURCE_FILE_NAMES: every harness file stays IN the target for every
          # config (SnapshotHarness.swift, LiveSelfTest.swift, LiveUITest*.swift, every
          # *Snapshots.swift registry). `AIWiring.swift`/`KronosIntents.swift` — not owned by
          # this leaf — reference `LiveSelfTest.reportPath` / `SnapshotHarness.isRequested` as
          # plain production guards, so excluding the file breaks their compile. Instead each
          # harness file's own BODY is compiled out under Release (`#if !RELEASE` around the
          # real implementation, a minimal stub in the `#else` branch with the same member
          # names) — see those files' own headers. project.yml only sets the flag
          # (SWIFT_ACTIVE_COMPILATION_CONDITIONS: RELEASE, above) that the stubs key off.
        # Local.xcconfig.example documents the override; the real Local.xcconfig is untracked
        # (.gitignore) and optional — Release builds fine without it, ad hoc signed.
        # xcconfig include must come from a real file: `#include? "Local.xcconfig"` (the `?`
        # makes it optional) keeps a from-scratch checkout building with nothing to create.

  kronos-mcp:
    type: tool
    platform: macOS
    sources:
      - path: Tools/kronos-mcp
    configFiles:
      Release: Release.xcconfig
    settings:
      base:
        PRODUCT_NAME: kronos-mcp
        PRODUCT_BUNDLE_IDENTIFIER: com.besic.kronos.mcp
        SKIP_INSTALL: YES
      configs:
        Alpha:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Kronos Dev"
          ENABLE_HARDENED_RUNTIME: NO
          DEVELOPMENT_TEAM: ""
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
          CODE_SIGN_STYLE: Manual
          ENABLE_HARDENED_RUNTIME: NO


schemes:
  Kronos:
    build:
      targets:
        Kronos: [run, test, profile, analyze, archive]
    run:
      config: Alpha
    test:
      config: Alpha
    archive:
      config: AppStore
